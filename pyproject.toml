[project]
name = "hesabdari-novin"
version = "3.1.0"
description = "برنامهٔ حسابداری کسب‌وکار کوچک (PySide6 + SQLite)"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".venv", "build", "dist", "schema_embedded.py"]

[tool.ruff.lint]
# E702/E701 (چند دستور در یک خط) به‌صورت تاریخی در این کد استفاده شده؛
# به‌تدریج پاک‌سازی می‌شود ولی فعلاً CI را نمی‌شکند.
ignore = ["E501", "E702", "E701", "E741", "E731", "B017"]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "F401"]
