name: CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: نصب وابستگی‌ها
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: کتابخانه‌های گرافیکی Qt (برای تست رابط کاربری)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 fonts-dejavu

      - name: لینت (ruff)
        run: ruff check .

      - name: تست‌های pytest (رگرسیون)
        run: python -m pytest

      - name: تست سناریویی منطق
        run: python tests/test_logic.py

      - name: تست سناریویی ویژگی‌ها
        run: python tests/test_features.py

      - name: تست رابط کاربری (offscreen)
        run: QT_QPA_PLATFORM=offscreen python tests/test_ui.py

      - name: بررسی کامپایل
        run: python -m compileall -q . -x '\.venv|build|dist'
